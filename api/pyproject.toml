[project]
name = "tripsmith-api"
version = "0.1.0"
description = "Tripsmith API — FastAPI backend (see docs/04-technical-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cuid2>=2.0.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[fastapi]>=2.69.1",
    "sqlalchemy[asyncio]>=2.0.53",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pypdf>=6.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The api/alembic/ folder is the migrations dir, not the `alembic` package.
known-third-party = ["alembic"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
