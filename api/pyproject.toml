[project]
name = "tripsmith-api"
version = "0.1.0"
description = "Tripsmith API — FastAPI backend (see docs/04-technical-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-asyncio", "httpx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
