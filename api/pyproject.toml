[project]
name = "tripsmith-api"
version = "0.1.0"
description = "Tripsmith API — FastAPI backend (see docs/04-technical-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=46",
    "cuid2>=2.0.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "sentry-sdk[fastapi]>=2.69.1",
    "sqlalchemy[asyncio]>=2.0.53",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pypdf>=6.21.2",
    "icalendar>=7.3.0",
    "coverage>=7.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts are the tests. S105-S107: the tests' secrets are fixed throwaway strings
# for fakes and test settings, never a real credential (gitleaks guards the real ones).
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
# The api/alembic/ folder is the migrations dir, not the `alembic` package.
known-third-party = ["alembic"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# Q-1 (docs/12): SQLAlchemy's async engine runs our code on greenlets; without greenlet
# concurrency coverage misses every line after the first await and reports 88 % (money modules
# 47–67 %) when the real number is ~96 %.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
fail_under = 94
show_missing = false
skip_covered = true
