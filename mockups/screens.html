<title>Tripsmith v1 Screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: light; --ease: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E6E0; color: #1C1C1A; font: 14px/1.5 "Instrument Sans", system-ui, sans-serif; }
  .chrome { position: sticky; top: 0; z-index: 60; background: #1C1C1A; color: #EDEAE3; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .chrome h1 { font: 600 14px/1 "Instrument Sans", sans-serif; margin: 0; }
  .chrome select { background: #2A2A27; color: #EDEAE3; border: 1px solid #4A4A46; border-radius: 6px; padding: 6px 10px; font: 600 13px "Instrument Sans", sans-serif; }
  .chrome .grp { display: flex; gap: 4px; align-items: center; }
  .chrome .grp span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin-right: 6px; }
  .chrome button { background: transparent; color: inherit; border: 1px solid #4A4A46; border-radius: 6px; padding: 5px 11px; font: 600 13px "Instrument Sans", sans-serif; cursor: pointer; }
  .chrome button[aria-pressed="true"] { background: #EDEAE3; color: #1C1C1A; border-color: #EDEAE3; }
  .chrome .nav { display: flex; gap: 4px; }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 0; min-height: calc(100vh - 48px); }
  .side { background: #FFFDF8; border-right: 1px solid #DDD8CE; padding: 14px 10px; position: sticky; top: 48px; height: calc(100vh - 48px); overflow: auto; }
  .side h2 { font: 700 11px "Instrument Sans", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8A857A; margin: 14px 8px 6px; }
  .side button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; font: 500 13px "Instrument Sans", sans-serif; cursor: pointer; color: #1C1C1A; }
  .side button:hover { background: #F1ECE3; }
  .side button[aria-current="true"] { background: #1C1C1A; color: #fff; }
  .side button small { opacity: .55; font-size: 11px; }
  .stage { padding: 14px 16px 60px; }
  .note { max-width: 1100px; margin: 0 auto 12px; }
  .note p { margin: 0; background: #FFFDF8; border: 1px solid #DDD8CE; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .frame { margin: 0 auto; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: clip; border-radius: 6px; }
  .frame.desktop { max-width: 1360px; }
  .frame.phone { width: 390px; max-width: 100%; border-radius: 30px; border: 8px solid #1C1C1A; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { position: static; height: auto; max-height: 40vh; } }

  /* ================= SYSTEM: K · Ocean + Marigold ================= */
  .site { container-type: inline-size; position: relative; --bg: #FFFFFF; --bg2: #F3F6FC; --ink: #14202A; --ink2: #3B4148; --mute: #5E6B76; --line: #E3E8EC; --pri: #1B4FD8; --pri-ink: #143EAD; --pri-soft: #E8EEFF; --act: #F2A93B; --act-ink: #D98F1F; --ok: #1F7A4D; --ok-soft: #E3F0EA; --warn: #B5541E; --warn-soft: #FFF1DD; --wa: #25D366;
        background: var(--bg); color: var(--ink); font: 15px/1.5 "DM Sans", system-ui, sans-serif; min-height: 100%; }
  .site * { box-sizing: border-box; }
  .site ::selection { background: var(--pri); color: #fff; }
  .site h1, .site h2, .site h3, .site h4 { margin: 0; font-weight: 800; letter-spacing: -.03em; text-wrap: balance; line-height: 1.1; }
  .site a { color: inherit; }
  .site img { display: block; max-width: 100%; }
  .site :focus-visible { outline: 2px solid var(--pri); outline-offset: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .ph { position: relative; overflow: hidden; background: #DDE3E6; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
  .wrap { width: min(1220px, 100% - 48px); margin-inline: auto; }
  .ic { width: 18px; height: 18px; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; line-height: 1.2; }
  .badge.fill { background: var(--warn-soft); color: var(--warn); } .badge.sure { background: var(--ok-soft); color: var(--ok); } .badge.sold { background: #EEF0F2; color: #7A8790; }
  .badge.new { background: var(--pri-soft); color: var(--pri); } .badge.contacted { background: #FFF1DD; color: var(--warn); } .badge.converted { background: var(--ok-soft); color: var(--ok); } .badge.closed { background: #EEF0F2; color: #7A8790; }
  .badge.draft { background: #EEF0F2; color: #7A8790; } .badge.live { background: var(--ok-soft); color: var(--ok); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font: 700 14px "DM Sans", sans-serif; text-decoration: none; border: 1.5px solid transparent; cursor: pointer; background: var(--act); color: var(--ink); transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .25s; box-shadow: 0 8px 20px -10px rgba(242,169,59,.8); white-space: nowrap; }
  .btn:hover { background: var(--act-ink); transform: translateY(-2px); }
  .btn.pri { background: var(--pri); color: #fff; box-shadow: 0 8px 20px -10px rgba(27,79,216,.7); }
  .btn.pri:hover { background: var(--pri-ink); }
  .btn.line { background: #fff; color: var(--ink); border-color: var(--line); box-shadow: none; }
  .btn.line:hover { border-color: var(--ink); background: #fff; }
  .btn.wa { background: var(--wa); color: #fff; box-shadow: 0 8px 20px -10px rgba(37,211,102,.7); }
  .btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: #fff; color: #B42318; border-color: #F3D0CC; box-shadow: none; }
  .stamp { position: absolute; top: 10px; right: 10px; width: 84px; height: 84px; border-radius: 50%; border: 2px dashed currentColor; display: grid; place-items: center; text-align: center; font: 700 9px/1.15 "DM Sans", sans-serif; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-12deg); background: rgba(255,255,255,.92); box-shadow: 0 6px 16px -8px rgba(0,0,0,.35); }
  .stamp b { display: block; font: 800 15px "DM Sans", sans-serif; letter-spacing: -.01em; text-transform: none; }
  .stamp.fill { color: var(--warn); } .stamp.sure { color: var(--ok); } .stamp.sold { color: #7A8790; }
  .top { display: flex; align-items: center; gap: 26px; padding: 14px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font: 800 20px "DM Sans", sans-serif; letter-spacing: -.03em; color: var(--pri); text-decoration: none; }
  .top nav { display: flex; gap: 22px; margin-left: auto; font-weight: 600; font-size: 14px; }
  .top nav a { text-decoration: none; }
  .top nav a.on { color: var(--pri); }
  .top .phone { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--pri); text-decoration: none; }
  .top .burger { display: none; margin-left: auto; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; place-items: center; }
  .crumbs { font-size: 13px; color: var(--mute); padding: 14px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs a { text-decoration: none; }
  .pagehead { padding: 22px 0 8px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
  .pagehead h1 { font-size: clamp(30px, 3.6vw, 44px); }
  .pagehead p { margin: 6px 0 0; color: var(--mute); font-size: 16px; max-width: 60ch; }
  section { padding: 56px 0 0; }
  .sechead { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .sechead h2 { font-size: clamp(26px, 3.2vw, 38px); }
  .sechead p { margin: 4px 0 0; color: var(--mute); }
  .sechead a { font-weight: 700; color: var(--pri); text-decoration: none; white-space: nowrap; }
  footer { margin-top: 72px; background: var(--ink); color: #B7C0C8; padding: 48px 0 24px; font-size: 14px; }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 28px; }
  footer b { color: #fff; display: block; margin-bottom: 10px; font-weight: 700; }
  footer a { text-decoration: none; display: block; margin-bottom: 6px; }
  footer .fine { border-top: 1px solid #2A3944; margin-top: 32px; padding-top: 18px; font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .wa-fab { position: absolute; right: 22px; bottom: 22px; z-index: 5; }
  /* home */
  .hero { position: relative; height: 620px; overflow: hidden; }
  .hero .ph { position: absolute; inset: 0; }
  .hero .ph img { animation: kb 30s var(--ease) infinite alternate; }
  @keyframes kb { from { transform: scale(1) } to { transform: scale(1.08) } }
  .hero .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,30,40,.35), rgba(10,30,40,.05) 40%, rgba(10,30,40,.55) 100%); }
  .hero .copy { position: absolute; left: 0; right: 0; top: 96px; text-align: center; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.35); padding: 0 20px; }
  .hero h1 { font-size: clamp(40px, 5.6vw, 72px); line-height: 1.02; max-width: 16ch; margin: 0 auto; }
  .hero p { font-size: 18px; font-weight: 500; margin: 14px auto 0; max-width: 560px; opacity: .95; }
  .search { position: relative; z-index: 3; margin: -72px auto 0; width: min(1080px, 100% - 48px); background: #fff; border-radius: 18px; padding: 10px; display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr auto; gap: 6px; box-shadow: 0 30px 60px -24px rgba(20,32,42,.35), 0 1px 0 rgba(0,0,0,.04); }
  .search.inline { margin: 18px 0 0; width: 100%; box-shadow: none; border: 1px solid var(--line); }
  .fld { padding: 10px 14px; border-right: 1px solid var(--line); display: flex; gap: 10px; align-items: center; cursor: pointer; border-radius: 10px; transition: background .2s; }
  .fld:hover { background: var(--bg2); }
  .fld:nth-last-child(2) { border-right: 0; }
  .fld .ic { color: var(--pri); }
  .fld label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; cursor: pointer; }
  .fld .v { font-weight: 700; font-size: 15px; }
  .search .btn { padding: 0 26px; font-size: 15px; }
  .themes { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .theme { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: 14px; text-decoration: none; transition: border-color .25s, transform .3s var(--ease); }
  .theme:hover, .theme.on { border-color: var(--pri); color: var(--pri); }
  .theme .ic { color: var(--pri); }
  .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 44px; }
  .trust div { display: flex; gap: 12px; align-items: center; background: var(--bg2); border-radius: 14px; padding: 14px 16px; font-size: 14px; }
  .trust .ic { color: var(--pri); width: 22px; height: 22px; }
  .trust b { display: block; font-weight: 800; }
  .trust span { color: var(--mute); }
  .dests { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .dests.big { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .dest { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; text-decoration: none; color: #fff; }
  .dests.big .dest { aspect-ratio: 4 / 3; }
  .dest .ph { position: absolute; inset: 0; }
  .dest .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,20,30,.8), transparent 55%); }
  .dest:hover .ph img { transform: scale(1.06); }
  .dest .t { position: absolute; left: 14px; right: 14px; bottom: 14px; }
  .dest b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .dests.big .dest b { font-size: 26px; }
  .dest small { font-size: 12px; font-weight: 600; opacity: .95; }
  .dest .n { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; display: grid; grid-template-rows: auto 1fr; transition: transform .45s var(--ease), box-shadow .45s var(--ease); position: relative; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 30px 50px -30px rgba(20,32,42,.35); }
  .card .ph { aspect-ratio: 16 / 10; }
  .card:hover .ph img { transform: scale(1.05); }
  .card .body { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; }
  .card .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mute); font-weight: 600; }
  .card .stars { color: var(--act); letter-spacing: 1px; }
  .card h3 { font-size: 20px; line-height: 1.2; }
  .card .hotel { font-size: 13px; color: var(--mute); }
  .inc { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute); font-weight: 600; }
  .inc span { display: inline-flex; align-items: center; gap: 5px; }
  .inc .ic { width: 15px; height: 15px; color: var(--pri); }
  .card .foot { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .card .price small { display: block; font-size: 12px; color: var(--mute); font-weight: 600; }
  .card .price b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .card .price b i { font-style: normal; font-size: 13px; font-weight: 600; color: var(--mute); }
  .about { display: grid; grid-template-columns: 1fr 1.1fr; gap: 44px; align-items: center; margin-top: 72px; }
  .frame-ph { position: relative; }
  .frame-ph .ph { aspect-ratio: 4 / 3; border: 10px solid #fff; border-radius: 4px; box-shadow: 0 30px 60px -30px rgba(20,32,42,.5); transform: rotate(-1.5deg); }
  .frame-ph .ph2 { position: absolute; right: -24px; bottom: -34px; width: 42%; aspect-ratio: 1; border: 8px solid #fff; border-radius: 4px; box-shadow: 0 20px 40px -20px rgba(20,32,42,.5); transform: rotate(4deg); }
  .pm { position: absolute; left: -22px; top: -22px; width: 108px; height: 108px; border-radius: 50%; border: 2px dashed var(--act-ink); color: var(--act-ink); display: grid; place-items: center; text-align: center; font: 700 9px/1.2 "DM Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; background: rgba(255,255,255,.92); transform: rotate(-10deg); }
  .pm b { display: block; font: 800 22px "DM Sans", sans-serif; letter-spacing: -.02em; text-transform: none; }
  .about h2 { font-size: clamp(26px, 3.2vw, 38px); }
  .about p { color: var(--mute); font-size: 16px; margin: 12px 0 0; max-width: 52ch; }
  .facts { display: flex; gap: 24px; margin-top: 22px; flex-wrap: wrap; }
  .facts b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .facts small { color: var(--mute); font-weight: 600; }
  .why { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .why div { border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .why .ic { width: 28px; height: 28px; color: var(--act-ink); margin-bottom: 12px; }
  .why b { display: block; font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .why p { margin: 0; color: var(--mute); font-size: 14px; }
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .review { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 10px; box-shadow: 0 16px 34px -22px rgba(20,32,42,.35); transform: rotate(-.6deg); position: relative; }
  .review:nth-child(2) { transform: rotate(.7deg); }
  .review::before { content: ""; position: absolute; top: -10px; left: 50%; width: 70px; height: 22px; margin-left: -35px; background: rgba(242,169,59,.45); transform: rotate(-3deg); border-radius: 2px; }
  .review .who { display: flex; align-items: center; gap: 12px; }
  .review .av { width: 42px; height: 42px; border-radius: 50%; background: var(--pri); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .review .who b { display: block; }
  .review .who small { color: var(--mute); }
  .review .stars { color: var(--act); letter-spacing: 2px; font-size: 13px; }
  .review p { margin: 0; font-size: 15px; }
  .review .trip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--pri); background: var(--bg2); border-radius: 999px; padding: 4px 10px; width: max-content; }
  .band { margin-top: 72px; background: linear-gradient(120deg, var(--pri-ink), var(--pri)); color: #fff; border-radius: 22px; padding: 44px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; }
  .band h2 { font-size: clamp(26px, 3vw, 36px); }
  .band p { opacity: .9; margin: 10px 0 0; font-size: 16px; }
  .form { display: grid; gap: 10px; }
  .form.card-form { background: #fff; color: var(--ink); border-radius: 16px; padding: 16px; }
  .form label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); display: block; margin-bottom: 5px; }
  .form input, .form select, .form textarea { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 500 15px "DM Sans", sans-serif; width: 100%; background: #fff; color: var(--ink); }
  .form input:focus, .form select:focus, .form textarea:focus { outline: 2px solid var(--pri); outline-offset: 1px; border-color: transparent; }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form .err { color: #B42318; font-size: 12px; font-weight: 600; margin-top: 4px; }
  .form input.bad { border-color: #F04438; }
  .form small.help { color: var(--mute); }
  /* listing */
  .listing { display: grid; grid-template-columns: 280px 1fr; gap: 28px; padding-top: 22px; align-items: start; }
  .filters { position: sticky; top: 16px; border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 18px; }
  .filters h3 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .filters .grp { display: grid; gap: 8px; }
  .filters .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .filters .chk i { width: 18px; height: 18px; border: 1.5px solid var(--line); border-radius: 5px; display: inline-block; }
  .filters .chk.on i { background: var(--pri); border-color: var(--pri); position: relative; }
  .filters .chk.on i::after { content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .filters .chk span:last-child { margin-left: auto; color: var(--mute); font-size: 12px; }
  .range { height: 4px; background: var(--line); border-radius: 2px; position: relative; margin: 14px 8px 6px; }
  .range i { position: absolute; left: 10%; right: 35%; top: 0; bottom: 0; background: var(--pri); border-radius: 2px; }
  .range b { position: absolute; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--pri); }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar .count { font-weight: 700; }
  .toolbar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .toolbar .chip { background: var(--pri-soft); color: var(--pri); font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 999px; display: inline-flex; gap: 6px; }
  .toolbar .sort { margin-left: auto; font-size: 14px; color: var(--mute); }
  .toolbar .sort b { color: var(--ink); }
  .listing .cards { grid-template-columns: 1fr 1fr; }
  .empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 48px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .empty h3 { font-size: 22px; }
  .empty p { margin: 0; color: var(--mute); max-width: 40ch; }
  /* package page */
  .phero { position: relative; margin-top: 14px; }
  .phero .ph { aspect-ratio: 21 / 9; border-radius: 18px; }
  .phero .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 32px; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.4); background: linear-gradient(to top, rgba(10,20,30,.7), transparent 70%); border-radius: 0 0 18px 18px; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
  .phero h1 { font-size: clamp(32px, 4.6vw, 56px); }
  .phero .sub { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-weight: 600; font-size: 14px; }
  .phero .share { display: flex; gap: 8px; }
  .phero .share .btn { background: rgba(255,255,255,.94); color: var(--ink); text-shadow: none; }
  .gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-auto-rows: 150px; gap: 8px; margin-top: 8px; }
  .gallery .ph { border-radius: 10px; cursor: zoom-in; }
  .gallery .ph:first-child { grid-row: span 2; }
  .gallery .ph:hover img { transform: scale(1.05); }

const policy = (which) => pageWrap(`<div class="wrap"><div class="crumbs"><a href="#" data-s="S1">Home</a><span>›</span><span>Policies</span></div><div class="pagehead"><div><h1>${which === 'terms' ? 'Terms of service' : which === 'privacy' ? 'Privacy policy' : 'Cancellation & refunds'}</h1><p>Last updated 12 September 2026</p></div></div>

  <div class="prose">${which === 'cancel' ? `<h2>If you cancel</h2><p>Every package on this site follows the same schedule, counted from the departure date:</p><ul><li><b>30 days or more before departure:</b> full refund, minus any non-refundable flight or train tickets we bought for you.</li><li><b>15 to 29 days:</b> 50% of the package price is retained.</li><li><b>14 days or fewer:</b> no refund.</li></ul><h2>If we cancel</h2><p>If a departure does not reach minimum numbers or cannot run safely (weather, road closures), we tell you at least 10 days before and offer a full refund or a free move to another date.</p><h2>Changes</h2><p>One free date change up to 30 days before departure, subject to seats. Name changes are free at any time.</p><h2>How refunds are paid</h2><p>To the original payment method within 7 working days of confirming the cancellation.</p>` : which === 'privacy' ? `<h2>What we collect</h2><p>When you enquire we store your name, phone number, email, travel month, party size and anything you write to us, so that we can call you back and send the itinerary.</p><h2>What we do with it</h2><p>We use it to respond to your enquiry and, if you book, to run your trip. We do not sell it, and we do not add you to a newsletter.</p><h2>Who sees it</h2><p>Only the four of us at Tripsmith and the hotels and transport partners who need names for your booking.</p><h2>Your choices</h2><p>Email hello@tripsmith.in to see or delete what we hold. We delete enquiry data that did not lead to a booking after 12 months.</p>` : `<h2>Who we are</h2><p>Tripsmith Holidays, 14 Church Street, Bengaluru 560001, is a tour operator registered in Karnataka.</p><h2>What a package includes</h2><p>Exactly what the package page lists under “Included”. Anything under “Not included” is paid by you locally.</p><h2>Prices</h2><p>Per person, in Indian rupees, based on the sharing shown. Prices hold for 7 days from a written quote. GST at 5% applies.</p><h2>Booking</h2><p>A booking is confirmed when we receive the advance and send you a confirmation with a booking reference. Until then, seats are not held.</p><h2>Responsibility</h2><p>We choose partners carefully but do not run the hotels, coaches or cruises ourselves. We are not liable for delays caused by weather, strikes or events outside our control, but we will always help you sort it out.</p>`}</div></div>`);

/* ---------- switcher ---------- */
const ORDER = ['S1','S2','S3','S4','S4b','S5','S6','S7','S8','S9','S10','S11','S12','S13','A1','A2','A3','A4','A5','A6','A7'];
let cur = 'S1', w = 'desktop'; try { cur = localStorage.getItem('ts-screen') || 'S1'; w = localStorage.getItem('ts-w') || 'desktop'; } catch (e) {}
if (!S[cur]) cur = 'S1';
function sideNav() { const side = document.getElementById('side'); let g = ''; side.innerHTML = ORDER.map(k => { const s = S[k]; const h = s.g !== g ? `<h2>${s.g}</h2>` : ''; g = s.g; return `${h}<button data-k="${k}" aria-current="${k===cur}"><span>${s.t}</span><small>${k}</small></button>`; }).join(''); }
function render() {
  const frame = document.getElementById('frame'); frame.className = 'frame ' + w; frame.innerHTML = S[cur].h();
  document.getElementById('note').innerHTML = `<b>${cur} · ${S[cur].t}</b> — ${S[cur].n}`;
  sideNav(); document.querySelectorAll('.chrome button[data-w]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === w)));
  window.scrollTo({ top: 0 }); try { localStorage.setItem('ts-screen', cur); localStorage.setItem('ts-w', w); } catch (e) {}
}
document.getElementById('side').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { cur = b.dataset.k; render(); } });
document.querySelector('.chrome').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.w) { w = b.dataset.w; render(); } if (b.id === 'prev' || b.id === 'next') { const i = ORDER.indexOf(cur); cur = ORDER[(i + (b.id === 'next' ? 1 : ORDER.length - 1)) % ORDER.length]; render(); } });
document.getElementById('frame').addEventListener('click', e => { const a = e.target.closest('[data-s]'); if (!a) return; e.preventDefault(); if (S[a.dataset.s]) { cur = a.dataset.s; render(); } });
render();
</script>
