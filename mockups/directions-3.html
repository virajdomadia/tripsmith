  /* ================= I · SUNLIT ================= */
  .vi { --bg: #FFFFFF; --bg2: #F5F8FA; --ink: #14202A; --mute: #5E6B76; --line: #E3E8EC; --sea: #0E7C86; --sea-ink: #0A5F67; --coral: #FF6B4A; --coral-ink: #E6532F; --sun: #F2A93B; --ok: #1F7A4D;

  .vi .fld { padding: 10px 14px; border-right: 1px solid var(--line); display: flex; gap: 10px; align-items: center; cursor: pointer; border-radius: 10px; transition: background .2s; }

  .vi .dests { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .vi .dest { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; text-decoration: none; color: #fff; }
  .vi .dest .ph { position: absolute; inset: 0; }
  .vi .dest .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,20,30,.8), transparent 55%); }
  .vi .dest:hover .ph img { transform: scale(1.06); }

  .vi .badge.fill { background: #FFF1DD; color: #B5541E; } .vi .badge.sure { background: #E3F0EA; color: var(--ok); }
  .vi .why { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .vi .why div { border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .vi .why .ic { width: 28px; height: 28px; color: var(--coral); margin-bottom: 12px; }

    .vi .dests { grid-template-columns: repeat(3, 1fr); }
    .vi .cards, .vi .reviews { grid-template-columns: 1fr 1fr; }
    .vi .band { grid-template-columns: 1fr; padding: 28px; }
    .vi footer .cols { grid-template-columns: 1fr 1fr; }
  }
  @container (max-width: 600px) {
    .vi .hero { height: 520px; }

    .vi .search .btn { grid-column: auto; }
    .vi .trust, .vi .why, .vi .cards, .vi .reviews { grid-template-columns: 1fr; }

  /* ================= J · POSTCARD ================= */

/* ---------- J · Postcard ---------- */
const J = {
  note: '<b>J · Postcard.</b> Same content and the same real photos, but warmer and more editorial: cream paper, Fraunces serif headlines, a framed hero photo with a postmark stamp, destinations as tilted polaroids, packages as postcards with a “Filling fast” stamp, reviews on notepaper. Feels like a boutique agency that has actually been to these places — the “premium travel” half of your brief. Trade-off: it is a little slower to scan than I on a phone, and the tilt/stamp motifs must stay light or it turns kitsch.',
  html() { return `<div class="site vj"><div class="wrap">

    <div class="hero"><div><h1>Short Indian holidays, <em>planned by people who’ve been.</em></h1><p>Six destinations. Twelve trips we run ourselves, with real dates, hotels we have slept in, and a person who calls you back within two hours.</p>
      <form class="search" onsubmit="return false"><div class="fld"><label>Where to</label><div class="v">Anywhere in India</div></div><div class="fld"><label>Month</label><div class="v">November</div></div><div class="fld"><label>Budget / person</label><div class="v">Up to ₹25,000</div></div><button class="btn" type="button">Find trips</button></form>
      <div class="themes">${THEMES.map(t => `<a class="theme" href="#">${ic(t[0])}${t[1]}</a>`).join('')}</div></div>
      <div class="art">${ph(IMG.kerala[0], 'Houseboat on the Alleppey backwaters')}<div class="stamp">Tripsmith<b>2026</b>Bengaluru · India</div></div></div>
    <section><div class="sechead"><h2>Where would you like to go?</h2><p>Six places we know like the back of our hand.</p></div><div class="polas">${DEST.map(d => `<a class="pola" href="#">${ph(IMG[d.slug][0], d.name)}<b>${d.name}</b><small>from ${inr(d.from)} · best ${d.best}</small></a>`).join('')}</div></section>
    <section><div class="sechead"><h2>This season’s trips</h2><p>Every one with a departure you can count on.</p></div><div class="cards">${PKGS.map(p => `<a class="card" href="#">${ph(IMG[p.dest][p.i], p.name)}${p.badge ? `<div class="stamp">${p.badge === 'fill' ? 'Filling<b>fast</b>seats left' : 'Departure<b>✓</b>guaranteed'}</div>` : ''}<div class="body"><div class="top"><span>${destName(p.dest)} · ${dn(p)}</span><span>Next ${p.next}</span></div><h3>${p.name}</h3><p>${p.hl}</p><div class="inc">${INC}</div><div class="foot"><div class="price"><small>per person, double sharing</small><b class="num">${inr(p.from)}</b></div><span class="btn line">View trip</span></div></div></a>`).join('')}</div></section>
    <section><div class="why">${WHY.map(w => `<div>${ic(w[0])}<b>${w[1]}</b><p>${w[2]}</p></div>`).join('')}</div></section>
    <section><div class="sechead"><h2>Postcards back</h2><p>Real trips, real names, real dates.</p></div><div class="reviews">${REVIEWS.map(r => `<div class="review"><span class="stars">★★★★★</span><p>“${r[3]}”</p><small>${r[1]} · ${r[2]}</small></div>`).join('')}</div></section>
    <div class="band"><div><h2>Tell us the trip. We’ll call within two hours.</h2><p>Or WhatsApp us — 10 am to 8 pm, every day. Every itinerary comes as a PDF you can forward.</p><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><a class="btn teal" href="#">${ic('wa')}WhatsApp us</a><a class="btn line" href="#">${ic('phone')}+91 98450 12345</a></div></div>
      <form onsubmit="return false"><input placeholder="Your name"><input placeholder="Mobile number" inputmode="tel"><div class="row"><input placeholder="Travel month" style="flex:1"><input placeholder="Budget / person" style="flex:1"></div><button class="btn" type="button">Request a callback</button></form></div>
    <footer><div class="cols"><div><b>Tripsmith Holidays</b>14 Church Street, Bengaluru 560001<br>+91 98450 12345 · WhatsApp · hello@tripsmith.in<br>Mon–Sat, 10 am – 8 pm</div><div><b>Destinations</b>${DEST.map(d => `<a href="#">${d.name}</a>`).join('')}</div><div><b>Company</b><a href="#">About</a><a href="#">Contact</a><a href="#">Why Tripsmith</a></div><div><b>Policies</b><a href="#">Terms</a><a href="#">Privacy</a><a href="#">Cancellation & refunds</a></div></div><div class="fine"><span>© 2026 Tripsmith Holidays · a portfolio project by Viraj Domadia · Demo login: owner@tripsmith.in / demo1234</span><span style="max-width:520px">${CREDITS}</span></div></footer>
    </div><a class="btn teal wa-fab" href="#">${ic('wa')}WhatsApp</a></div>`; },
  motion(root) { if (!window.gsap || reduced) return;

    gsap.from(root.querySelector('.hero .stamp'), { scale: 0, rotate: -40, duration: .7, ease: 'back.out(2)', delay: 1.1 });
    ScrollTrigger.batch(root.querySelectorAll('.pola, .card, .why div, .review'), { start: 'top 88%', once: true, onEnter: els => gsap.from(els, { y: 26, opacity: 0, duration: .9, stagger: .07, ease: 'expo.out', overwrite: true }) });
  }
};

/* ---------- K · Sunlit base + Postcard touches ---------- */
const K = {
  note: '<b>K · Sunlit + Postcard touches — the proposal.</b> Everything from I (the hero, the search widget, theme chips, trust strip, destination and package cards with inclusion icons, the callback band) plus three borrowed from J: the “Filling fast / Guaranteed” badges become <b>postmark stamps</b> on the package cards, an <b>About Tripsmith</b> section with framed, slightly tilted photos and a stamp, and the reviews sit on <b>notepaper</b> pinned with tape. Same fonts, same colours as I — J’s warmth without J’s slower scan. This is the system the full v1 screen set would be built in. Use the <b>Colours</b> switcher above to compare palettes: primary (nav, icons, secondary buttons) + action (main buttons) + marigold stamps.',
  html() {
    let h = I.html().replace('class="site vi"', 'class="site vi vk"');
    // stamps instead of pill badges on package cards
    h = h.replace(/<span class="bd"><span class="badge (fill|sure)">[^<]+<\/span><\/span>/g, (m, b) => b === 'fill' ? '<div class="stampb fill">Filling<b>fast</b>few seats</div>' : '<div class="stampb sure">Departure<b>✓</b>guaranteed</div>');
    // about section before "Why book"
    const about = `<section class="about"><div class="frame-ph">${ph(IMG.kerala[0], 'Our team on the Alleppey backwaters')}<div class="ph2 ph"><img src="${IMG.himachal[1]}" alt="Solang valley, Himachal" loading="lazy"></div><div class="pm">Tripsmith<b>2026</b>Bengaluru · India</div></div><div><h2>A small team that has actually been.</h2><p>Tripsmith is four people in Bengaluru who plan short Indian holidays the way we would for our own families — the same hotels we have slept in, departures we run ourselves, and a phone that gets answered. No call centre, no “subject to availability”.</p><div class="facts"><div><b class="num">12</b><small>trips we run</small></div><div><b class="num">6</b><small>destinations we know</small></div><div><b class="num">2 h</b><small>callback promise</small></div><div><b class="num">2019</b><small>first departure</small></div></div><div style="margin-top:22px"><a class="btn sea" href="#">About Tripsmith</a></div></div></section>`;
    h = h.replace('<section><div class="sechead"><div><h2>Why book with Tripsmith</h2>', about + '<section><div class="sechead"><div><h2>Why book with Tripsmith</h2>');
    // reviews with a trip chip
    h = h.replace(/<span class="stars">★★★★★<\/span><p>“([^”]+)”<\/p><\/div>/g, (m, t) => `<span class="stars">★★★★★</span><p>“${t}”</p><span class="trip">${ic('pin')}Verified traveller</span></div>`);
    return h;
  },
  motion(root) { I.motion(root); if (!window.gsap || reduced) return;
    gsap.from(root.querySelectorAll('.stampb'), { scale: 0, rotate: -40, duration: .7, ease: 'back.out(2)', stagger: .08, scrollTrigger: { trigger: root.querySelector('.cards'), start: 'top 85%', once: true } });
    gsap.from(root.querySelector('.about .pm'), { scale: 0, rotate: -40, duration: .7, ease: 'back.out(2)', scrollTrigger: { trigger: root.querySelector('.about'), start: 'top 75%', once: true } });
  }
};

/* ---------- switcher ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V = { i:I, j:J, k:K };
let cur = 'k', pal = 'sea'; try { cur = localStorage.getItem('ts-dir3') || 'k'; pal = localStorage.getItem('ts-pal') || 'sea'; } catch (e) {}
if (!V[cur]) cur = 'k';
if (window.gsap) gsap.registerPlugin(ScrollTrigger);
function render() {
  if (window.gsap) { ScrollTrigger.getAll().forEach(t => t.kill()); gsap.globalTimeline.clear(); }
  const frame = document.getElementById('frame'); frame.innerHTML = V[cur].html();
  document.getElementById('tradeoff').innerHTML = V[cur].note;
  document.querySelectorAll('.chrome button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cur)));
  applyPal(); window.scrollTo({ top: 0 }); V[cur].motion(frame);
  if (window.gsap) requestAnimationFrame(() => ScrollTrigger.refresh());
  try { localStorage.setItem('ts-dir3', cur); } catch (e) {}
}
const PALS = [['sea','Sea + Coral','#0E7C86','#FF6B4A'],['ocean','Ocean + Marigold','#1B4FD8','#F2A93B'],['brand','Brand teal + Marigold','#0F4C5C','#F2A93B'],['forest','Forest + Terracotta','#1F6F50','#D9622B'],['indigo','Indigo + Saffron','#2B2D6B','#F28C28'],['sunset','Sunset red + Marigold','#B23A48','#F2A93B']];
let compare = false;
function renderBoard() {
  if (window.gsap) { ScrollTrigger.getAll().forEach(t => t.kill()); gsap.globalTimeline.clear(); }
  const frame = document.getElementById('frame');
  const html = K.html();
  frame.innerHTML = `<div class="board">${PALS.map(p => `<div class="cell" data-pick="${p[0]}" role="button" tabindex="0" aria-pressed="${p[0] === pal}"><div class="lab"><span>${p[1]}</span><span class="sw"><i style="background:${p[2]}"></i><i style="background:${p[3]}"></i><i style="background:#F2A93B"></i></span></div><div class="zoom">${html.replace('class="site vi vk"', `class="site vi vk" data-pal="${p[0]}"`)}</div></div>`).join('')}</div>`;
  document.getElementById('tradeoff').innerHTML = '<b>All six palettes on the same page.</b> Primary colour drives the logo, nav, icons and secondary buttons; the action colour drives the main buttons; marigold stays for stamps. Click a tile to open that palette full-size.';
  document.getElementById('cmp').textContent = 'Back to full size';
  frame.querySelectorAll('.cell').forEach(c => { const pick = () => { pal = c.dataset.pick; compare = false; cur = 'k'; render(); }; c.addEventListener('click', pick); c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } }); });
  window.scrollTo({ top: 0 });
}
function applyPal() { const site = document.querySelector('.vk'); document.getElementById('pals').style.display = ''; if (site) site.dataset.pal = pal; document.querySelectorAll('#pals button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pal === pal))); try { localStorage.setItem('ts-pal', pal); } catch (e) {} }
document.querySelector('.chrome').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { cur = b.dataset.v; compare = false; document.getElementById('cmp').textContent = 'Compare all six'; render(); return; } const pb = e.target.closest('button[data-pal]'); if (pb) { pal = pb.dataset.pal; if (compare) renderBoard(); else applyPal(); return; } if (e.target.closest('#cmp')) { compare = !compare; if (compare) { cur = 'k'; renderBoard(); } else { document.getElementById('cmp').textContent = 'Compare all six'; render(); } } });
render();
</script>
