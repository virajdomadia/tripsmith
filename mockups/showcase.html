<title>Tripsmith Showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #F7F4EE; --bg2: #FFFFFF; --bg3: #EFEBE3; --ink: #14181C; --ink2: #3B4148; --mute: #5F6670; --line: #E4DFD5; --line2: #D3CDC0;
    --acc: #1A4BD6; --acc-ink: #1238A8; --acc-soft: #E6ECFB; --sun: #F2A93B; --ok: #1F7A4D; --ok-soft: #E3F0EA; --warn: #B5541E; --warn-soft: #FBEBD1;
    --serif: "Newsreader", Georgia, "Times New Roman", serif; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --r: 10px; --gutter: clamp(16px, 4vw, 48px); --max: 1240px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; caret-color: var(--acc); }
  ::selection { background: var(--acc); color: #fff; }
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line2); border: 3px solid var(--bg); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mute); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 4px; }
  a { color: inherit; }
  img, svg, canvas { max-width: 100%; display: block; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -.02em; text-wrap: balance; margin: 0; line-height: 1.05; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { width: min(var(--max), 100% - 2 * var(--gutter)); margin-inline: auto; }
  .em { font-style: italic; font-weight: 400; }

  /* ---------- link underline that "travels" ---------- */
  .ln { position: relative; text-decoration: none; }
  .ln::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
  .ln:hover::after, .ln:focus-visible::after { transform: scaleX(1); }

  /* ---------- buttons ---------- */
  .btn { --b: var(--ink); display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 8px; background: var(--b); color: #fff; font: 600 15px var(--sans); text-decoration: none; border: 1px solid transparent; cursor: pointer; white-space: nowrap; position: relative; overflow: hidden; transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .25s; }
  .btn::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s var(--ease); }
  .btn:hover::before { transform: translateX(120%); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px rgba(20,24,28,.35); }
  .btn:active { transform: translateY(0); }
  .btn.acc { --b: var(--acc); }
  .btn.acc:hover { background: var(--acc-ink); }
  .btn.line { --b: transparent; color: var(--ink); border-color: var(--line2); }
  .btn.line:hover { background: var(--bg2); box-shadow: 0 6px 18px -8px rgba(20,24,28,.25); }
  .btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 0 rgba(242,169,59,.6); }
  .btn:hover .dot { animation: pulse 1.4s var(--ease) infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,169,59,.6) } 100% { box-shadow: 0 0 0 10px rgba(242,169,59,0) } }

  /* ---------- scenes (procedural "photos") ---------- */
  .scene { position: relative; overflow: hidden; background: #DCE3E6; }
  .scene canvas { position: absolute; inset: -4%; width: 108%; height: 108%; max-width: none; transform-origin: 50% 60%; }
  .scene.kb canvas { animation: kb 26s var(--ease) infinite alternate; }
  @keyframes kb { from { transform: scale(1) translateY(0) } to { transform: scale(1.06) translateY(-1.5%) } }
  .scene .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 24px; color: #fff; text-shadow: 0 1px 24px rgba(0,0,0,.35); background: linear-gradient(to top, rgba(10,14,18,.55), transparent 70%); }
  .scene .cap small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .9; margin-bottom: 6px; }
  .scene .cap b { font: 500 clamp(22px, 2.6vw, 34px) var(--serif); letter-spacing: -.02em; }
  .scene .cap span { display: block; font-size: 14px; margin-top: 4px; opacity: .95; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; line-height: 1.3; letter-spacing: .01em; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.fill { background: var(--warn-soft); color: var(--warn); }
  .badge.sure { background: var(--ok-soft); color: var(--ok); }
  .badge.sold { background: var(--bg3); color: var(--mute); }

  /* ---------- top chrome ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: rgba(247,244,238,.72); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border-bottom: 1px solid transparent; transition: border-color .3s; }
  .top.scrolled { border-bottom-color: var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 28px; height: 68px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 600 14px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
  .logo svg { width: 28px; height: 28px; }
  .top nav { display: flex; gap: 28px; margin-left: auto; font-weight: 500; font-size: 15px; }
  .top nav a.dim { color: var(--mute); }
  .top .btn { padding: 10px 16px; font-size: 14px; }
  .switch { display: flex; gap: 2px; background: var(--bg3); border-radius: 999px; padding: 3px; }
  .switch button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font: 600 12px var(--sans); color: var(--mute); cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- HOME · hero ---------- */
  .hero { position: relative; padding: clamp(40px, 7vh, 80px) 0 0; }
  .hero .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(28px, 4vw, 64px); align-items: center; }
  .hero h1 { font-size: clamp(52px, 7.2vw, 96px); letter-spacing: -.035em; line-height: .98; }
  .hero h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .hero h1 .w span { display: inline-block; }
  .hero .lead { font-size: clamp(18px, 1.6vw, 22px); color: var(--mute); max-width: 440px; margin: 22px 0 0; line-height: 1.4; }
  .ask { margin-top: 30px; width: min(600px, 100%); background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(20,24,28,.04), 0 24px 60px -24px rgba(20,24,28,.25); transition: box-shadow .35s var(--ease), border-color .25s; }
  .ask:focus-within { border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft), 0 24px 60px -24px rgba(20,24,28,.25); }
  .ask input { flex: 1; min-width: 0; border: 0; background: transparent; font: 400 17px var(--sans); color: var(--ink); outline: none; padding: 8px 0; }
  .ask input::placeholder { color: var(--mute); }
  .ask .type { flex: 1; min-width: 0; font: 400 17px var(--sans); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 8px 0; }
  .ask .type::after { content: ""; display: inline-block; width: 1.5px; height: 1.1em; background: var(--acc); vertical-align: -3px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { opacity: 0 } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px 7px 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: transparent; transition: background .25s, border-color .25s, transform .35s var(--ease); }
  .chip .sw { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; position: relative; }
  .chip .sw canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chip:hover { background: var(--bg2); border-color: var(--ink); transform: translateY(-1px); }
  .hero .art { position: relative; }
  .hero .art .scene { aspect-ratio: 4 / 5; border-radius: 14px; box-shadow: 0 40px 80px -40px rgba(20,24,28,.45); }
  .hero .art .tag { position: absolute; left: -18px; bottom: 56px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 16px 40px -20px rgba(20,24,28,.35); display: grid; gap: 2px; font-size: 13px; }
  .hero .art .tag b { font: 500 18px var(--serif); }
  .hero .art .tag small { color: var(--mute); }
  .route-hero { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .route-hero path { fill: none; stroke: var(--acc); stroke-width: 2; stroke-dasharray: 6 7; stroke-linecap: round; }
  .route-hero .end { fill: var(--sun); }
  .route-hero .start { fill: var(--acc); }

  /* ---------- marquee ---------- */
  .marquee { margin-top: clamp(56px, 8vh, 96px); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 0; overflow: hidden; white-space: nowrap; }
  .marquee .track { display: inline-flex; gap: 48px; padding-right: 48px; animation: mq 40s linear infinite; will-change: transform; }
  .marquee:hover .track { animation-play-state: paused; }
  .marquee .it { display: inline-flex; align-items: baseline; gap: 12px; font: 500 20px var(--serif); }
  .marquee .it small { font: 500 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .marquee .it i { width: 6px; height: 6px; border-radius: 50%; background: var(--sun); align-self: center; }
  @keyframes mq { to { transform: translateX(-50%) } }

  /* ---------- featured ---------- */
  .feature { margin-top: clamp(56px, 8vh, 96px); }
  .feature .scene { aspect-ratio: 21 / 9; border-radius: 14px; }
  .feature .scene canvas { inset: -12% 0 0; height: 124%; }
  .feature .cap { padding: 32px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .feature .cap .btn { text-shadow: none; }

  /* ---------- journeys (horizontal) ---------- */
  .journeys { margin-top: clamp(72px, 10vh, 120px); }
  .sechead { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
  .sechead h2 { font-size: clamp(34px, 4vw, 52px); }
  .sechead p { margin: 6px 0 0; color: var(--mute); max-width: 460px; }
  .sechead .ln { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .rail-wrap { position: relative; }
  .rail { display: flex; gap: 20px; will-change: transform; }
  .card { flex: 0 0 min(400px, 78vw); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-decoration: none; color: var(--ink); display: grid; grid-template-rows: auto 1fr; transition: transform .5s var(--ease), box-shadow .5s var(--ease), border-color .3s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 30px 60px -30px rgba(20,24,28,.35); border-color: var(--line2); }
  .card .scene { aspect-ratio: 4 / 3; }
  .card .scene canvas { transition: transform 1.2s var(--ease); }
  .card:hover .scene canvas { transform: scale(1.05); }
  .card .scene .b { position: absolute; top: 14px; left: 14px; }
  .card .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
  .card .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  .card h3 { font-size: 26px; }
  .card p { margin: 0; color: var(--mute); font-size: 14px; }
  .card .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .card .price { font: 500 22px var(--serif); }
  .card .price small { font: 400 13px var(--sans); color: var(--mute); }
  .card .go { color: var(--acc); font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .card .go svg { width: 16px; height: 16px; transition: transform .35s var(--ease); }
  .card:hover .go svg { transform: translateX(4px); }
  .rail-mobile { display: none; }

  /* ---------- concierge ---------- */
  .concierge { margin-top: clamp(72px, 10vh, 120px); }
  .concierge .panel { background: var(--ink); color: #EDE9E1; border-radius: 16px; padding: clamp(28px, 4vw, 64px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: center; position: relative; overflow: hidden; }
  .concierge .panel::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 60%; aspect-ratio: 1; background: radial-gradient(closest-side, rgba(26,75,214,.45), transparent 70%); pointer-events: none; }
  .concierge h2 { font-size: clamp(34px, 4vw, 52px); color: #fff; }
  .concierge p { color: #B9B4AA; font-size: 17px; margin: 16px 0 26px; max-width: 440px; }
  .concierge .pts { display: grid; gap: 12px; font-size: 15px; padding: 0; margin: 0; list-style: none; }
  .concierge .pts li { display: flex; gap: 12px; align-items: baseline; }
  .concierge .pts li::before { content: ""; width: 18px; height: 2px; background: var(--sun); flex: none; transform: translateY(-4px); }
  .chat { position: relative; background: var(--bg2); color: var(--ink); border-radius: 14px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); min-height: 380px; align-content: start; }
  .chat .hd { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mute); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .chat .hd b { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat .hd b i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; opacity: 0; transform: translateY(8px); }
  .msg.show { opacity: 1; transform: none; transition: opacity .4s var(--ease), transform .5s var(--ease); }
  .msg.u { background: var(--bg3); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.a { background: var(--bg2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .dots { display: inline-flex; gap: 4px; }
  .msg .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); animation: bounce 1s infinite; }
  .msg .dots i:nth-child(2) { animation-delay: .15s } .msg .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-4px) } }
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini a { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-decoration: none; color: var(--ink); font-size: 12px; opacity: 0; transform: translateY(10px) scale(.98); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
  .mini a.show { opacity: 1; transform: none; transition: opacity .45s var(--ease), transform .55s var(--ease); }
  .mini a:hover { box-shadow: 0 14px 30px -18px rgba(20,24,28,.4); }
  .mini .scene { aspect-ratio: 16 / 9; }
  .mini .t { padding: 8px 10px; display: grid; gap: 2px; }
  .mini b { font-size: 13px; }
  .mini .t span { color: var(--mute); }
  .chat .in { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--mute); font-size: 14px; display: flex; justify-content: space-between; margin-top: auto; }

  /* ---------- why ---------- */
  .why { margin-top: clamp(72px, 10vh, 120px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 80px); align-items: start; }
  .why h2 { font-size: clamp(34px, 4vw, 52px); position: sticky; top: 100px; }
  .why dl { margin: 0; display: grid; }
  .why .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; padding: 22px 0; border-top: 1px solid var(--line); }
  .why .row:last-child { border-bottom: 1px solid var(--line); }
  .why dt { font: 500 24px var(--serif); letter-spacing: -.01em; }
  .why dd { margin: 0; color: var(--mute); font-size: 15px; }

  /* ---------- quotes ---------- */
  .quotes { margin-top: clamp(72px, 10vh, 120px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .quote { border-top: 2px solid var(--ink); padding-top: 18px; }
  .quote p { font: 400 22px/1.35 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
  .quote small { color: var(--mute); font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .quote small i { width: 22px; height: 1px; background: var(--line2); }

  /* ---------- footer ---------- */
  footer { margin-top: clamp(80px, 12vh, 140px); border-top: 1px solid var(--line); padding: 48px 0 28px; font-size: 14px; color: var(--mute); }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 28px; }
  footer b { color: var(--ink); display: block; margin-bottom: 10px; font-weight: 600; }
  footer a { text-decoration: none; display: block; margin-bottom: 6px; width: max-content; }
  footer .fine { margin-top: 36px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  footer .big { font: 500 clamp(44px, 9vw, 120px) var(--serif); letter-spacing: -.04em; color: var(--ink); line-height: 1; margin: 0 0 32px; opacity: .08; user-select: none; }

  /* ---------- floating concierge ---------- */
  .fab { position: fixed; right: 22px; bottom: 22px; z-index: 30; background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 18px 12px 14px; display: flex; align-items: center; gap: 10px; font: 600 14px var(--sans); box-shadow: 0 18px 40px -14px rgba(20,24,28,.5); text-decoration: none; transition: transform .35s var(--ease); }
  .fab:hover { transform: translateY(-2px); }
  .fab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); animation: pulse 2.4s var(--ease) infinite; }

  /* ---------- PACKAGE ---------- */
  .phero { margin-top: 18px; }
  .crumbs { font-size: 14px; color: var(--mute); padding: 16px 0 12px; display: flex; gap: 8px; }
  .crumbs a { text-decoration: none; }
  .phero .scene { aspect-ratio: 21 / 9; border-radius: 14px; }
  .phero .scene canvas { inset: -10% 0 0; height: 120%; }
  .phero .cap { padding: 36px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .phero h1 { font-size: clamp(36px, 5vw, 68px); color: #fff; letter-spacing: -.03em; }
  .phero .sub { font-size: 16px; margin-top: 10px; opacity: .95; display: flex; gap: 14px; flex-wrap: wrap; }
  .phero .share { display: flex; gap: 8px; }
  .phero .share .btn { background: rgba(255,255,255,.94); color: var(--ink); text-shadow: none; padding: 10px 14px; font-size: 14px; }
  .facts { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); }
  .facts div { padding: 16px 20px; border-right: 1px solid var(--line); }
  .facts div:last-child { border-right: 0; }
  .facts small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 600; margin-bottom: 4px; }
  .facts b { font: 500 21px var(--serif); }
  .pgrid { display: grid; grid-template-columns: 1fr 380px; gap: clamp(32px, 5vw, 64px); margin-top: 40px; align-items: start; }
  .pgrid h2 { font-size: clamp(28px, 3vw, 36px); margin: 48px 0 18px; }
  .pgrid h2:first-of-type { margin-top: 0; }
  .lede { font: 400 clamp(20px, 1.8vw, 24px)/1.45 var(--serif); margin: 0 0 8px; letter-spacing: -.01em; max-width: 60ch; }
  .hl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; padding: 0; margin: 0; list-style: none; font-size: 15px; }
  .hl li { display: flex; gap: 10px; align-items: baseline; }
  .hl li::before { content: ""; width: 14px; height: 2px; background: var(--acc); flex: none; transform: translateY(-4px); }

  /* storyboard */
  .story { display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start; }
  .days { display: grid; }
  .tday { position: relative; padding: 22px 0 22px 40px; border-top: 1px solid var(--line); transition: opacity .4s; }
  .tday:last-child { border-bottom: 1px solid var(--line); }
  .tday::before { content: ""; position: absolute; left: 6px; top: 32px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line2); background: var(--bg); transition: background .3s, border-color .3s, transform .4s var(--ease); }
  .tday.on::before { background: var(--acc); border-color: var(--acc); transform: scale(1.25); }
  .tday::after { content: ""; position: absolute; left: 11.5px; top: 46px; bottom: -2px; width: 1.5px; background: repeating-linear-gradient(to bottom, var(--line2) 0 5px, transparent 5px 10px); }
  .tday:last-child::after { display: none; }
  .tday .n { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); font-weight: 600; }
  .tday h3 { font-size: 24px; margin: 4px 0 8px; }
  .tday p { margin: 0 0 10px; color: var(--ink2); font-size: 15px; max-width: 60ch; }
  .tday .tags { display: flex; gap: 8px; }
  .tday .tags span { font-size: 12px; font-weight: 600; color: var(--mute); background: var(--bg3); border-radius: 999px; padding: 4px 10px; }

/* ============ procedural scenes ============ */
const PAL = {
  goa:       { sky:['#F9DDB0','#8AD0DC'], sun:[.78,.22], ridges:['#2A8AA0','#1E6F86','#155A6E'], water:['#5FC0CF','#1E6F86'], horizon:.62 },
  kerala:    { sky:['#E6F0D8','#7FB59A'], sun:[.3,.2], ridges:['#3F8A64','#2F7A56','#1F5A3E','#0F3D2E'], water:['#5B8F7A','#0F3D2E'], horizon:.7 },
  himachal:  { sky:['#F1F4F8','#8CA5C6'], sun:[.2,.18], ridges:['#93A9C4','#5B7EA6','#3E5A80','#233A5C'], water:null, horizon:.55 },
  rajasthan: { sky:['#FBE1AE','#E8A45C'], sun:[.72,.3], ridges:['#D98F52','#C9713A','#9C4A24','#7A2E1D'], water:null, horizon:.6 },
  andaman:   { sky:['#FFF4DE','#5FC6DA'], sun:[.62,.2], ridges:['#0F6F88','#0A5C75'], water:['#7ED7E6','#1592AE'], horizon:.58 },
  ladakh:    { sky:['#EEE6F5','#A398BD'], sun:[.5,.16], ridges:['#A8977A','#8B7A5E','#6A5A48','#4A3F5C'], water:['#7E8FA8','#4A3F5C'], horizon:.68 },
};
function rnd(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function paint(el) {
  const k = el.dataset.kind, P = PAL[k] || PAL.goa;
  let c = el.querySelector('canvas'); if (!c) { c = document.createElement('canvas'); el.prepend(c); }
  const r = el.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(devicePixelRatio || 1, 1.5), W = Math.round(r.width * 1.08 * dpr), H = Math.round(r.height * 1.08 * dpr);
  if (c.width === W && c.height === H) return; c.width = W; c.height = H;
  const g = c.getContext('2d'), R = rnd(k.length * 7919 + [...el.className].length + Math.round(r.width));
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, P.sky[0]); sky.addColorStop(1, P.sky[1]); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // sun
  const sx = P.sun[0] * W, sy = P.sun[1] * H, sr = Math.min(W, H) * .07;
  const halo = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 5); halo.addColorStop(0, 'rgba(255,240,200,.75)'); halo.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.fillStyle = '#F2A93B'; g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
  // ridges
  const hz = P.horizon * H, n = P.ridges.length;
  P.ridges.forEach((col, i) => {
    const base = hz - (n - 1 - i) * H * .08, amp = H * (.06 + .05 * (n - i)), f1 = 1 + R() * 2, f2 = 3 + R() * 4, ph = R() * 6.28;
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) { const t = x / W; const y = base - amp * (0.55 * Math.sin(t * f1 * 3.14 + ph) + 0.3 * Math.sin(t * f2 * 6.28 + ph * 2) + 0.15 * Math.sin(t * 23 + ph)); g.lineTo(x, y); }
    g.lineTo(W, H); g.closePath(); g.fill();
    // atmospheric haze between layers
    if (i < n - 1) { const hz2 = g.createLinearGradient(0, base - amp, 0, base + amp); hz2.addColorStop(0, 'rgba(255,255,255,0)'); hz2.addColorStop(1, 'rgba(255,255,255,.18)'); g.fillStyle = hz2; g.fillRect(0, base - amp, W, amp * 2); }
  });
  // water
  if (P.water) {
    const wy = hz + H * .02, wg = g.createLinearGradient(0, wy, 0, H); wg.addColorStop(0, P.water[0]); wg.addColorStop(1, P.water[1]); g.fillStyle = wg; g.fillRect(0, wy, W, H - wy);
    g.globalAlpha = .35; g.strokeStyle = '#fff'; g.lineWidth = 1 * dpr;
    for (let i = 0; i < 26; i++) { const y = wy + R() * (H - wy), x = sx + (R() - .5) * W * .5, l = (R() * .25 + .05) * W * (1 - (y - wy) / (H - wy) * .5); g.beginPath(); g.moveTo(x - l / 2, y); g.lineTo(x + l / 2, y); g.stroke(); }
    g.globalAlpha = 1;
  }
  // vignette + grain
  const v = g.createRadialGradient(W * .5, H * .45, H * .3, W * .5, H * .5, H * .95); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.28)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  const gr = document.createElement('canvas'); gr.width = gr.height = 128; const gg = gr.getContext('2d'), id = gg.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const s = 128 + (R() - .5) * 90; id.data[i] = id.data[i+1] = id.data[i+2] = s; id.data[i+3] = 22; }
  gg.putImageData(id, 0, 0); g.fillStyle = g.createPattern(gr, 'repeat'); g.fillRect(0, 0, W, H);
}
function paintAll() { document.querySelectorAll('.scene').forEach(paint); }

/* pointer helpers */
function tilt(sel) {
  if (reduced || !hasGsap || matchMedia('(hover: none)').matches) return;
  document.querySelectorAll(sel).forEach(card => {
    const cv = card.querySelector('.scene canvas');
    const move = e => { const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      gsap.to(card, { rotateY: x * 8, rotateX: -y * 8, duration: .6, ease: 'power2.out', transformPerspective: 900 });
      if (cv) gsap.to(cv, { x: -x * 14, y: -y * 14, duration: .6, ease: 'power2.out' }); };
    const leave = () => { gsap.to(card, { rotateY: 0, rotateX: 0, duration: .8, ease: 'expo.out' }); if (cv) gsap.to(cv, { x: 0, y: 0, duration: .8, ease: 'expo.out' }); };
    card.addEventListener('mousemove', move); card.addEventListener('mouseleave', leave);
    cleanup.push(() => { card.removeEventListener('mousemove', move); card.removeEventListener('mouseleave', leave); });
  });
}
function magnetic(sel) {
  if (reduced || !hasGsap || matchMedia('(hover: none)').matches) return;
  document.querySelectorAll(sel).forEach(b => {
    const move = e => { const r = b.getBoundingClientRect(); gsap.to(b, { x: (e.clientX - r.left - r.width / 2) * .22, y: (e.clientY - r.top - r.height / 2) * .35, duration: .5, ease: 'power2.out' }); };
    const leave = () => gsap.to(b, { x: 0, y: 0, duration: .7, ease: 'elastic.out(1, .5)' });
    b.addEventListener('mousemove', move); b.addEventListener('mouseleave', leave);
    cleanup.push(() => { b.removeEventListener('mousemove', move); b.removeEventListener('mouseleave', leave); });
  });
}

function staticChat() { const m1 = document.getElementById('m1'), m2 = document.getElementById('m2'); if (!m1) return; m1.textContent = '3 days in Goa under ₹15k for 2 of us, mid-November'; m1.classList.add('show'); m2.textContent = 'Two trips fit. North Goa Beaches has a Sat 14 Nov departure at ₹14,999 per person with 6 seats left. South Goa Quiet Escape is ₹17,499, a little over budget. Want me to check dates?'; m2.classList.add('show'); document.querySelectorAll('#m3 a').forEach(a => a.classList.add('show')); }

function motionPkg() {
  const route = document.getElementById('route'), stops = [...document.querySelectorAll('.map .stop')], days = [...document.querySelectorAll('.tday')], lbl = document.getElementById('mapday');
  const setDay = i => { days.forEach((d, k) => d.classList.toggle('on', k === i)); stops.forEach(st => st.classList.toggle('on', +st.dataset.i <= i)); lbl.textContent = 'Day ' + (i + 1); };
  // subnav scroll-spy
  const links = [...document.querySelectorAll('.subnav a')], ind = document.getElementById('ind');
  const place = a => { if (!a) return; ind.style.width = a.offsetWidth + 'px'; ind.style.transform = `translateX(${a.offsetLeft}px)`; };
  const activate = a => { links.forEach(l => l.classList.toggle('on', l === a)); place(a); };
  activate(links[0]); requestAnimationFrame(() => place(links[0]));
  links.forEach(a => { const h = e => { e.preventDefault(); const t = document.querySelector(a.getAttribute('href')); if (!t) return; const y = t.getBoundingClientRect().top + scrollY - 130; lenis ? lenis.scrollTo(y) : window.scrollTo({ top: y, behavior: reduced ? 'auto' : 'smooth' }); }; a.addEventListener('click', h); cleanup.push(() => a.removeEventListener('click', h)); });
  // gallery lightbox (manual FLIP)
  const lb = document.getElementById('lightbox');
  const open = el => { const r = el.getBoundingClientRect(); lb.querySelectorAll('.scene').forEach(x => x.remove()); const c = el.cloneNode(true); c.removeAttribute('role'); c.removeAttribute('tabindex'); lb.prepend(c); lb.querySelector('.cap').textContent = el.dataset.cap || ''; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    const W = Math.min(innerWidth * .9, 1100), H = Math.min(innerHeight * .8, W * .66);
    if (reduced || !hasGsap) { Object.assign(c.style, { left: (innerWidth - W) / 2 + 'px', top: (innerHeight - H) / 2 + 'px', width: W + 'px', height: H + 'px' }); paint(c); return; }
    gsap.set(c, { left: r.left, top: r.top, width: r.width, height: r.height }); paint(c);
    gsap.to(c, { left: (innerWidth - W) / 2, top: (innerHeight - H) / 2, width: W, height: H, duration: .7, ease: 'expo.inOut', onComplete: () => paint(c) });
    lenis && lenis.stop(); };
  const close = () => { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); lenis && lenis.start(); };
  const galleryEls = document.querySelectorAll('.gallery .scene');
  galleryEls.forEach(el => { const k = e => { if (e.type === 'click' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el); } }; el.addEventListener('click', k); el.addEventListener('keydown', k); cleanup.push(() => { el.removeEventListener('click', k); el.removeEventListener('keydown', k); }); });
  const lbClick = e => { if (e.target === lb || e.target.closest('.x')) close(); }, esc = e => { if (e.key === 'Escape') close(); };
  lb.addEventListener('click', lbClick); document.addEventListener('keydown', esc); cleanup.push(() => { lb.removeEventListener('click', lbClick); document.removeEventListener('keydown', esc); close(); });

  if (reduced || !hasGsap) { setDay(3); if (route) route.style.strokeDasharray = '5 6'; return; }
  gsap.from('.phero .scene', { clipPath: 'inset(0 0 100% 0 round 14px)', duration: 1.3, ease: 'expo.inOut' });
  gsap.from('.phero h1, .phero .sub, .phero .share', { y: 20, opacity: 0, duration: .9, stagger: .08, delay: .5, ease: 'expo.out' });
  gsap.from('.facts div', { y: 14, opacity: 0, duration: .7, stagger: .06, delay: .8, ease: 'expo.out' });
  gsap.to('.phero .scene canvas', { yPercent: 8, ease: 'none', scrollTrigger: { trigger: '.phero .scene', start: 'top top', end: 'bottom top', scrub: true } });
  const L = route.getTotalLength(); gsap.set(route, { strokeDasharray: L, strokeDashoffset: L });
  const st = { trigger: '#days', start: 'top 60%', end: 'bottom 60%', scrub: .4 };
  gsap.to(route, { strokeDashoffset: 0, ease: 'none', scrollTrigger: { ...st, onUpdate: self => setDay(Math.min(3, Math.floor(self.progress * 4))) } });
  if (window.MotionPathPlugin) gsap.to('#marker', { motionPath: { path: '#route', align: '#route', alignOrigin: [.5, .5] }, ease: 'none', scrollTrigger: st });
  setDay(0);
  // scroll-spy
  [['#s-over', 0], ['#s-days', 1], ['#s-photos', 2], ['#s-price', 3], ['#s-dates', 4], ['#s-faq', 5]].forEach(([sel, i]) => ScrollTrigger.create({ trigger: sel, start: 'top 140px', end: () => `+=${document.querySelector(sel).nextElementSibling ? document.querySelector(sel).nextElementSibling.offsetHeight + 60 : 400}`, onEnter: () => activate(links[i]), onEnterBack: () => activate(links[i]) }));
  ScrollTrigger.batch('.hl li, .incl li, .gallery .scene, tbody tr', { start: 'top 90%', once: true, onEnter: els => gsap.from(els, { y: 16, opacity: 0, duration: .8, ease: 'expo.out', stagger: .05, overwrite: true }) });
  gsap.from('tbody .seat i b', { scaleX: 0, duration: 1, ease: 'expo.out', stagger: .08, scrollTrigger: { trigger: 'table', start: 'top 85%', once: true } });
  tilt('.related .card'); magnetic('aside .btn.acc, .cta-mobile .btn.acc');
}

/* ============ router with curtain transition ============ */
const view = document.getElementById('view');
let current = null;
function mount(p) {
  current = p; killMotion();
  view.innerHTML = p === 'home' ? HOME() : PKGV();
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go === p)));
  scrollTop(); paintAll();
  if (p === 'home') motionHome(); else motionPkg();
  if (hasGsap) requestAnimationFrame(() => ScrollTrigger.refresh());
  try { localStorage.setItem('ts-showcase', p); } catch (e) {}
}
function go(p) {
  if (p === current) return;
  if (reduced || !hasGsap || current === null) { mount(p); return; }
  const w = document.getElementById('wipe');
  gsap.timeline()
    .to(w, { yPercent: -101, duration: .55, ease: 'expo.inOut', onComplete: () => mount(p) })
    .to(w, { yPercent: -202, duration: .55, ease: 'expo.inOut', delay: .08, onComplete: () => gsap.set(w, { yPercent: 0 }) });
}
document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (!a) return; e.preventDefault(); go(a.dataset.go); });
addEventListener('scroll', () => document.getElementById('top').classList.toggle('scrolled', scrollY > 8), { passive: true });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { paintAll(); if (hasGsap) ScrollTrigger.refresh(); }, 150); });
let start = 'home'; try { start = localStorage.getItem('ts-showcase') || 'home'; } catch (e) {}
document.fonts && document.fonts.ready.then(() => hasGsap && ScrollTrigger.refresh());
intro(() => mount(start));
</script>
