<title>Tripsmith Directions II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root { color-scheme: light; --ease: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E6E0; color: #1C1C1A; font: 15px/1.5 "Instrument Sans", system-ui, sans-serif; }
  .chrome { position: sticky; top: 0; z-index: 60; background: #1C1C1A; color: #EDEAE3; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .chrome h1 { font: 600 14px/1 "Instrument Sans", sans-serif; margin: 0; letter-spacing: .02em; }
  .chrome .grp { display: flex; gap: 4px; align-items: center; }
  .chrome .grp span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin-right: 6px; }
  .chrome button { background: transparent; color: inherit; border: 1px solid #4A4A46; border-radius: 6px; padding: 5px 11px; font: 600 13px "Instrument Sans", sans-serif; cursor: pointer; }
  .chrome button[aria-pressed="true"] { background: #EDEAE3; color: #1C1C1A; border-color: #EDEAE3; }

  .site { container-type: inline-size; position: relative; }

  .site h1, .site h2, .site h3 { margin: 0; text-wrap: balance; }
  .site a { color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .scene { position: relative; overflow: hidden; background: #BFC7CC; }
  .scene canvas { position: absolute; inset: -4%; width: 108%; height: 108%; max-width: none; transform-origin: 50% 60%; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; line-height: 1.3; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .wrap { width: min(1220px, 100% - 48px); margin-inline: auto; }

  /* ================= E · NIGHT ================= */
  .ve { --bg: #0B0F14; --bg2: #121820; --ink: #F3EFE6; --mute: #9AA3AD; --line: rgba(255,255,255,.12); --acc: #F2A93B; --acc2: #5B9BFF;
        background: var(--bg); color: var(--ink); font: 16px/1.55 "Instrument Sans", system-ui, sans-serif; }
  .ve ::selection { background: var(--acc); color: #0B0F14; }
  .ve h1, .ve h2, .ve h3 { font-family: "Newsreader", Georgia, serif; font-weight: 400; letter-spacing: -.02em; }
  .ve header { position: absolute; inset: 0 0 auto; z-index: 5; display: flex; align-items: center; gap: 26px; padding: 22px 0; }
  .ve .logo { font: 600 13px "Instrument Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .ve nav { margin-left: auto; display: flex; gap: 24px; font-size: 14px; font-weight: 500; }
  .ve nav a { text-decoration: none; opacity: .85; }
  .ve .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font: 600 14px "Instrument Sans", sans-serif; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); backdrop-filter: blur(8px); transition: background .25s, transform .35s var(--ease); }
  .ve .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .ve .btn.sun { background: var(--acc); color: #0B0F14; border-color: var(--acc); }
  .ve .btn.sun:hover { background: #F7B95A; }
  .ve .hero { position: relative; height: 760px; }
  .ve .hero .scene { position: absolute; inset: 0; }
  .ve .hero .scene canvas { transition: opacity 1.4s var(--ease); }
  .ve .hero .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #0B0F14 0%, rgba(11,15,20,.55) 40%, rgba(11,15,20,.15) 70%, rgba(11,15,20,.35) 100%); }
  .ve .hero .copy { position: absolute; left: 0; right: 0; bottom: 84px; }
  .ve .hero h1 { font-size: clamp(48px, 7vw, 104px); line-height: .95; letter-spacing: -.03em; max-width: 12ch; }
  .ve .hero h1 em { font-style: italic; color: var(--acc); }
  .ve .hero h1 .place { display: inline-block; }
  .ve .hero p { color: var(--mute); font-size: 18px; margin: 18px 0 0; max-width: 460px; }
  .ve .glass { margin-top: 28px; width: min(720px, 100%); display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 2px; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 16px; padding: 6px; backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); }
  .ve .glass .f { padding: 10px 16px; border-right: 1px solid var(--line); }
  .ve .glass .f:nth-last-child(2) { border-right: 0; }
  .ve .glass label { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  .ve .glass .v { font-weight: 500; }
  .ve .dots { position: absolute; right: 0; bottom: 100px; display: grid; gap: 10px; }

  .ve .dots button[aria-current="true"] { background: var(--acc); }
  .ve section { padding: 80px 0 0; }
  .ve .sechead { display: flex; align-items: end; justify-content: space-between; margin-bottom: 26px; }
  .ve .sechead h2 { font-size: clamp(32px, 4vw, 48px); }

  .ve .rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: none; }
  .ve .rail::-webkit-scrollbar { display: none; }
  .ve .dcard { flex: 0 0 260px; height: 360px; border-radius: 18px; overflow: hidden; position: relative; scroll-snap-align: start; text-decoration: none; transition: transform .5s var(--ease); }
  .ve .dcard:hover { transform: translateY(-6px); }
  .ve .dcard .scene { position: absolute; inset: 0; }

  .ve .dcard .t { position: absolute; left: 18px; right: 18px; bottom: 18px; }

  .ve .dcard small { color: var(--mute); font-size: 13px; }
  .ve .list { border-top: 1px solid var(--line); }
  .ve .row { display: grid; grid-template-columns: 1.6fr 1fr 1fr auto; gap: 24px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); text-decoration: none; position: relative; transition: padding .35s var(--ease); }
  .ve .row:hover { padding-left: 14px; }
  .ve .row h3 { font-size: 30px; letter-spacing: -.02em; }
  .ve .row .m { color: var(--mute); font-size: 14px; }
  .ve .row .p { font: 400 26px "Newsreader", serif; }
  .ve .row .p small { font: 400 13px "Instrument Sans", sans-serif; color: var(--mute); }
  .ve .row .go { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background .25s, transform .35s var(--ease); }
  .ve .row:hover .go { background: var(--acc); color: #0B0F14; transform: rotate(-45deg); }
  .ve .badge.fill { background: rgba(242,169,59,.15); color: var(--acc); }
  .ve .badge.sure { background: rgba(91,155,255,.15); color: var(--acc2); }
  .ve .peek { position: fixed; width: 260px; aspect-ratio: 4/3; border-radius: 14px; pointer-events: none; z-index: 70; opacity: 0; transform: scale(.9); transition: opacity .35s var(--ease), transform .5s var(--ease); box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
  .ve .peek.show { opacity: 1; transform: none; }
  .ve .conc { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; border: 1px solid var(--line); border-radius: 24px; padding: 48px; background: radial-gradient(80% 120% at 100% 0%, rgba(91,155,255,.18), transparent 60%), var(--bg2); }

  .ve .msg .cards a { display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); text-decoration: none; font-size: 12px; }
  .ve .msg .cards .scene { aspect-ratio: 16/9; }
  .ve .msg .cards div.t { padding: 8px 10px; }
  .ve footer { margin-top: 90px; border-top: 1px solid var(--line); padding: 40px 0 24px; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  @container (max-width: 800px) {

    .ve .hero { height: 640px; }
    .ve .hero h1 { font-size: 46px; }
    .ve .glass { grid-template-columns: 1fr; }
    .ve .glass .f { border-right: 0; border-bottom: 1px solid var(--line); }
    .ve .dots { display: none; }
    .ve .row { grid-template-columns: 1fr auto; }
    .ve .row .m, .ve .row .p small { display: none; }
    .ve .row h3 { font-size: 22px; }
    .ve .conc { grid-template-columns: 1fr; padding: 26px; }
    .ve .peek { display: none; }
  }

  /* ================= F · BENTO ================= */
  .vf { --bg: #EEF0F3; --bg2: #FFFFFF; --ink: #111418; --mute: #6B7280; --line: #E3E6EA; --acc: #1A4BD6; --acc-soft: #E8EEFF; --sun: #F2A93B; --ok: #1F7A4D;
        background: var(--bg); color: var(--ink); font: 15px/1.5 "Manrope", system-ui, sans-serif; }
  .vf h1, .vf h2, .vf h3 { font-family: "Manrope", system-ui, sans-serif; font-weight: 800; letter-spacing: -.035em; }
  .vf header { display: flex; align-items: center; gap: 24px; padding: 18px 0; }
  .vf .logo { font: 800 18px "Manrope", sans-serif; letter-spacing: -.03em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .vf nav { margin-left: auto; display: flex; gap: 6px; }
  .vf nav a { text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
  .vf nav a.on { background: var(--bg2); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .vf .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 12px; font: 700 14px "Manrope", sans-serif; text-decoration: none; background: var(--ink); color: #fff; border: 0; cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
  .vf .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -12px rgba(0,0,0,.4); }
  .vf .btn.acc { background: var(--acc); }
  .vf .bento { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 150px; gap: 14px; padding: 6px 0 0; }
  .vf .tile { background: var(--bg2); border-radius: 22px; padding: 22px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(17,20,24,.04), 0 12px 32px -20px rgba(17,20,24,.18); transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .vf .tile:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(17,20,24,.04), 0 24px 44px -20px rgba(17,20,24,.28); }
  .vf .tile .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  .vf .t-hero { grid-column: span 4; grid-row: span 3; padding: 0; color: #fff; }
  .vf .t-hero .scene { position: absolute; inset: 0; }
  .vf .t-hero .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.6), transparent 55%); }
  .vf .t-hero .c { position: absolute; left: 28px; right: 28px; bottom: 28px; }
  .vf .t-hero h1 { font-size: clamp(36px, 4.6vw, 64px); line-height: .98; max-width: 12ch; }
  .vf .t-hero p { margin: 10px 0 0; opacity: .9; font-weight: 500; max-width: 420px; }
  .vf .t-ask { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; gap: 12px; }
  .vf .t-ask h2 { font-size: 26px; }
  .vf .t-ask .in { margin-top: auto; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--mute); font-weight: 500; }
  .vf .t-ask .in b { color: var(--ink); }
  .vf .t-ask .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .vf .t-ask .chip { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--acc-soft); color: var(--acc); }
  .vf .t-price { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between; }
  .vf .t-price b { font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .vf .t-price small { color: var(--mute); font-weight: 600; }
  .vf .t-best { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; }
  .vf .t-best h3 { font-size: 20px; margin: 4px 0 12px; }
  .vf .bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; align-items: end; flex: 1; }
  .vf .bars i { display: block; background: var(--acc-soft); border-radius: 6px 6px 3px 3px; height: var(--h); position: relative; transform-origin: bottom; }
  .vf .bars i.hi { background: var(--acc); }
  .vf .bars i.now { background: var(--sun); }
  .vf .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; font-size: 9px; color: var(--mute); font-weight: 700; text-align: center; margin-top: 6px; }
  .vf .t-map { grid-column: span 2; grid-row: span 2; padding: 0; }
  .vf .t-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vf .t-map .lab { position: absolute; left: 18px; top: 16px; }
  .vf .t-map .lab b { display: block; font-size: 16px; font-weight: 800; }
  .vf .t-conc { grid-column: span 2; grid-row: span 2; background: var(--ink); color: #fff; display: flex; flex-direction: column; gap: 8px; }
  .vf .t-conc .k { color: #9AA3AD; }
  .vf .t-conc .m { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); max-width: 92%; }
  .vf .t-conc .m.u { background: var(--acc); margin-left: auto; }
  .vf .t-conc .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #9AA3AD; margin-right: 3px; animation: bounce 1s infinite; }
  .vf .t-conc .dots i:nth-child(2) { animation-delay: .15s } .vf .t-conc .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-4px) } }
  .vf .t-dest { padding: 0; color: #fff; text-decoration: none; }
  .vf .t-dest .scene { position: absolute; inset: 0; }
  .vf .t-dest .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), transparent 60%); }
  .vf .t-dest b { position: absolute; left: 16px; bottom: 14px; font-size: 18px; font-weight: 800; }
  .vf .t-dest small { position: absolute; right: 14px; bottom: 16px; font-size: 12px; font-weight: 700; opacity: .9; }
  .vf .t-stats { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; }
  .vf .t-stats b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .vf .t-stats small { color: var(--mute); font-weight: 600; font-size: 12px; }
  .vf .t-j { grid-column: span 2; grid-row: span 2; padding: 0; text-decoration: none; display: grid; grid-template-rows: 1fr auto; }
  .vf .t-j .scene { min-height: 0; }
  .vf .t-j .b { padding: 14px 18px 16px; display: flex; justify-content: space-between; align-items: end; gap: 10px; }
  .vf .t-j h3 { font-size: 18px; }
  .vf .t-j small { color: var(--mute); font-weight: 600; display: block; margin-top: 2px; }
  .vf .t-j .p { font-weight: 800; font-size: 18px; white-space: nowrap; }
  .vf .badge.fill { background: #FFF1DD; color: #B5541E; } .vf .badge.sure { background: #E3F0EA; color: var(--ok); }
  .vf .t-j .badge { position: absolute; top: 12px; left: 12px; }
  .vf footer { padding: 40px 0 24px; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  @container (max-width: 900px) {
    .vf nav { display: none; }
    .vf .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 140px; }
    .vf .t-hero { grid-column: span 2; grid-row: span 3; }
    .vf .t-ask, .vf .t-best, .vf .t-map, .vf .t-conc, .vf .t-price, .vf .t-stats, .vf .t-j { grid-column: span 2; }
    .vf .t-dest { grid-column: span 1; }
  }

  /* ================= G · IMMERSIVE ================= */
  .vg { --bg: #0E0D0B; --ink: #F4EFE6; --mute: #A39C90; --line: rgba(255,255,255,.14); --acc: #F2A93B;
        background: var(--bg); color: var(--ink); font: 16px/1.5 "Instrument Sans", system-ui, sans-serif; }
  .vg h1, .vg h2, .vg h3 { font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -.03em; }
  .vg header { position: absolute; inset: 0 0 auto; z-index: 5; display: flex; align-items: center; gap: 26px; padding: 22px 0; mix-blend-mode: difference; color: #fff; }
  .vg .logo { font: 600 13px "Instrument Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .vg nav { margin-left: auto; display: flex; gap: 24px; font-size: 14px; font-weight: 500; }
  .vg nav a { text-decoration: none; }

  .vg .stage-g .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(14,13,11,.75), rgba(14,13,11,.2) 55%, rgba(14,13,11,.5)); }

  .vg .index .names { display: grid; gap: 2px; }
  .vg .index .names a { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: baseline; text-decoration: none; font: 500 clamp(28px, 4.4vw, 60px) "Fraunces", serif; letter-spacing: -.03em; color: rgba(244,239,230,.35); transition: color .4s, transform .5s var(--ease); line-height: 1.1; }
  .vg .index .names a.on { color: var(--ink); transform: translateX(10px); }
  .vg .index .names a small { font: 500 12px "Instrument Sans", sans-serif; letter-spacing: .12em; color: var(--mute); }
  .vg .index .names a span.i { font: 500 12px "Instrument Sans", sans-serif; letter-spacing: .12em; color: var(--acc); align-self: center; }
  .vg .index .side { justify-self: end; text-align: right; max-width: 380px; }
  .vg .index .side h1 { font-size: 22px; font-weight: 400; font-style: italic; color: var(--ink); }
  .vg .index .side p { color: var(--mute); font-size: 15px; margin: 8px 0 18px; }
  .vg .index .side .btn { display: inline-flex; gap: 8px; align-items: center; padding: 12px 20px; border-radius: 999px; background: var(--ink); color: #0E0D0B; font: 600 14px "Instrument Sans", sans-serif; text-decoration: none; }
  .vg .prog { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 2px; height: 160px; background: var(--line); }
  .vg .prog i { display: block; width: 100%; height: 16.66%; background: var(--acc); transition: transform .5s var(--ease); }
  .vg .ask { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(50%); z-index: 4; }
  .vg .ask .in { width: min(720px, 100%); margin: 0 auto; background: #fff; color: #0E0D0B; border-radius: 999px; padding: 8px 8px 8px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); font-weight: 500; }
  .vg .ask .in span { flex: 1; color: #6B6559; }
  .vg .ask .in span b { color: #0E0D0B; font-weight: 500; }
  .vg .ask .btn { padding: 12px 20px; border-radius: 999px; background: #0E0D0B; color: #fff; font: 600 14px "Instrument Sans", sans-serif; text-decoration: none; white-space: nowrap; }
  .vg section { padding: 110px 0 0; }
  .vg .sechead { display: flex; align-items: end; justify-content: space-between; margin-bottom: 26px; }
  .vg .sechead h2 { font-size: clamp(32px, 4vw, 52px); }

/* ---------- shared: cursor-following image peek ---------- */
function peek(root, sel, rowSel) {
  const pk = root.querySelector(sel); if (!pk || matchMedia('(hover: none)').matches) return;
  const rows = root.querySelectorAll(rowSel);
  const mv = e => { pk.style.left = (e.clientX + 24) + 'px'; pk.style.top = (e.clientY - 90) + 'px'; };
  rows.forEach(r => { const en = () => { pk.dataset.kind = r.dataset.peek; paint(pk, true); pk.classList.add('show'); }, lv = () => pk.classList.remove('show'); r.addEventListener('mouseenter', en); r.addEventListener('mouseleave', lv); cleanup.push(() => { r.removeEventListener('mouseenter', en); r.removeEventListener('mouseleave', lv); }); });
  document.addEventListener('mousemove', mv); cleanup.push(() => document.removeEventListener('mousemove', mv));
}

/* ---------- procedural scenes (same painter as the showcase) ---------- */
const PAL = {
  goa:       { sky:['#F9DDB0','#8AD0DC'], sun:[.78,.22], ridges:['#2A8AA0','#1E6F86','#155A6E'], water:['#5FC0CF','#1E6F86'], horizon:.62 },
  kerala:    { sky:['#E6F0D8','#7FB59A'], sun:[.3,.2], ridges:['#3F8A64','#2F7A56','#1F5A3E','#0F3D2E'], water:['#5B8F7A','#0F3D2E'], horizon:.7 },
  himachal:  { sky:['#F1F4F8','#8CA5C6'], sun:[.2,.18], ridges:['#93A9C4','#5B7EA6','#3E5A80','#233A5C'], water:null, horizon:.55 },
  rajasthan: { sky:['#FBE1AE','#E8A45C'], sun:[.72,.3], ridges:['#D98F52','#C9713A','#9C4A24','#7A2E1D'], water:null, horizon:.6 },
  andaman:   { sky:['#FFF4DE','#5FC6DA'], sun:[.62,.2], ridges:['#0F6F88','#0A5C75'], water:['#7ED7E6','#1592AE'], horizon:.58 },
  ladakh:    { sky:['#EEE6F5','#A398BD'], sun:[.5,.16], ridges:['#A8977A','#8B7A5E','#6A5A48','#4A3F5C'], water:['#7E8FA8','#4A3F5C'], horizon:.68 },
};
function rnd(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function paint(el, force) {
  const k = el.dataset.kind, P = PAL[k] || PAL.goa;
  let c = el.querySelector('canvas'); if (!c) { c = document.createElement('canvas'); el.prepend(c); }
  const r = el.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(devicePixelRatio || 1, 1.5), W = Math.round(r.width * 1.08 * dpr), H = Math.round(r.height * 1.08 * dpr);
  if (!force && c.width === W && c.height === H && c.dataset.kind === k) return; c.width = W; c.height = H; c.dataset.kind = k;
  const g = c.getContext('2d'), R = rnd(k.length * 7919 + Math.round(r.width) + 11);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, P.sky[0]); sky.addColorStop(1, P.sky[1]); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const sx = P.sun[0] * W, sy = P.sun[1] * H, sr = Math.min(W, H) * .07;
  const halo = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 5); halo.addColorStop(0, 'rgba(255,240,200,.75)'); halo.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.fillStyle = '#F2A93B'; g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
  const hz = P.horizon * H, n = P.ridges.length;
  P.ridges.forEach((col, i) => { const base = hz - (n - 1 - i) * H * .08, amp = H * (.06 + .05 * (n - i)), f1 = 1 + R() * 2, f2 = 3 + R() * 4, ph = R() * 6.28;
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) { const t = x / W; g.lineTo(x, base - amp * (0.55 * Math.sin(t * f1 * 3.14 + ph) + 0.3 * Math.sin(t * f2 * 6.28 + ph * 2) + 0.15 * Math.sin(t * 23 + ph))); }
    g.lineTo(W, H); g.closePath(); g.fill();
    if (i < n - 1) { const hz2 = g.createLinearGradient(0, base - amp, 0, base + amp); hz2.addColorStop(0, 'rgba(255,255,255,0)'); hz2.addColorStop(1, 'rgba(255,255,255,.18)'); g.fillStyle = hz2; g.fillRect(0, base - amp, W, amp * 2); } });
  if (P.water) { const wy = hz + H * .02, wg = g.createLinearGradient(0, wy, 0, H); wg.addColorStop(0, P.water[0]); wg.addColorStop(1, P.water[1]); g.fillStyle = wg; g.fillRect(0, wy, W, H - wy);
    g.globalAlpha = .35; g.strokeStyle = '#fff'; g.lineWidth = dpr;
    for (let i = 0; i < 26; i++) { const y = wy + R() * (H - wy), x = sx + (R() - .5) * W * .5, l = (R() * .25 + .05) * W * (1 - (y - wy) / (H - wy) * .5); g.beginPath(); g.moveTo(x - l / 2, y); g.lineTo(x + l / 2, y); g.stroke(); }
    g.globalAlpha = 1; }
  const v = g.createRadialGradient(W * .5, H * .45, H * .3, W * .5, H * .5, H * .95); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.28)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  const gr = document.createElement('canvas'); gr.width = gr.height = 128; const gg = gr.getContext('2d'), id = gg.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const sh = 128 + (R() - .5) * 90; id.data[i] = id.data[i+1] = id.data[i+2] = sh; id.data[i+3] = 22; }
  gg.putImageData(id, 0, 0); g.fillStyle = g.createPattern(gr, 'repeat'); g.fillRect(0, 0, W, H);
}
function paintAll(root) { (root || document).querySelectorAll('.scene').forEach(el => paint(el)); }

/* ---------- switcher ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

render();
</script>
