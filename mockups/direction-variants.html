  @container (max-width: 640px) {

        <h2>What’s in the price</h2><div class="incl"><div><h3>Included</h3><ul>${p.incl.map(i=>`<li>${i}</li>`).join('')}</ul></div><div><h3>Not included</h3><ul>${p.excl.map(i=>`<li>${i}</li>`).join('')}</ul></div></div>
        <h2>Where you stay</h2><div class="hotel">${ph('goa','Resort')}<div><b>${p.hotel.name}</b><br><span style="color:var(--mute)">${p.hotel.city} · ${p.hotel.stars} · ${p.hotel.nights}</span></div></div>
        <h2>Dates & prices</h2><table><thead><tr><th>Departure</th><th>Per person</th><th>Seats</th><th></th><th></th></tr></thead><tbody>${p.deps.map(d=>`<tr><td>${d.date}</td><td class="num">${inr(d.price)}</td><td class="num">${d.seats?d.seats+' left':'—'}</td><td>${badge(d.badge)}</td><td style="text-align:right">${d.seats?'<a class="btn btn-c teal" href="#">Enquire</a>':''}</td></tr>`).join('')}</tbody></table>
        <h2>Good to know</h2><div class="faq">${p.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>
      </main><aside><div class="box"><div class="from">From<b>${inr(p.from)}</b>per person · double sharing</div><a class="btn btn-c" href="#">Enquire about this trip</a><div class="row"><a class="btn" href="#">Customise</a><a class="btn" href="#">WhatsApp</a></div><div class="occ">${p.occ.map(o=>`<div><span>${o[0]}</span><span class="num">${o[1]}</span></div>`).join('')}</div><div class="call">We call back within 2 hours, 10 am – 8 pm.</div></div></aside></div>
      <section><div class="sechead"><h2>More like this</h2></div><div class="related">${PKGS.slice(1,4).map(this.card).join('')}</div></section>
    </div>
    <div class="cta-mobile"><div class="price"><b>${inr(p.from)}</b><small>per person</small></div><a class="btn btn-c line" href="#">PDF</a><a class="btn btn-c" href="#">Enquire</a></div>
    ${this.footer()}`); },
};

/* ---------- switcher ---------- */
const V = { a:A, b:B, c:C };
const state = { v:'a', p:'home', w:'desktop' };
try { Object.assign(state, JSON.parse(localStorage.getItem('ts-variants') || '{}')); } catch (e) {}
function render() {
  const frame = document.getElementById('frame');
  frame.className = 'frame ' + state.w;
  frame.innerHTML = V[state.v][state.p]();
  document.getElementById('tradeoff').innerHTML = V[state.v].note;
  document.querySelectorAll('.chrome button').forEach(b => {
    const k = b.dataset.v ? 'v' : b.dataset.p ? 'p' : 'w';
    b.setAttribute('aria-pressed', String(b.dataset[k] === state[k]));
  });
  try { localStorage.setItem('ts-variants', JSON.stringify(state)); } catch (e) {}
}
document.querySelector('.chrome').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) state.v = b.dataset.v; if (b.dataset.p) state.p = b.dataset.p; if (b.dataset.w) state.w = b.dataset.w;
  render(); window.scrollTo({ top: 0 });
});
render();
</script>
