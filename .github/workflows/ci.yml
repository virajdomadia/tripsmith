name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # web/ — Next.js: lint (eslint + prettier) → typecheck → vitest. No `next build` here: the
  # public pages are ISR and prerender against the api, which CI doesn't run — Vercel's preview
  # build (with API_URL) is the build check.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test

  # ---------------------------------------------------------------------------
  # api/ — FastAPI: ruff → pyright → pytest against a throwaway Postgres (S10+)
  # ---------------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container, no password at all (keeps secret scanners quiet too).
          POSTGRES_USER: tripsmith
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripsmith_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tripsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The pytest DB harness (api/tests/conftest.py) runs every `db`-marked test against it.
      TEST_DATABASE_URL: postgresql+asyncpg://tripsmith@localhost:5432/tripsmith_test
      # A missing TEST_DATABASE_URL fails the run instead of silently skipping the db tests.
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      # Python's version comes from api/.python-version.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --directory api
      - run: uv run --directory api ruff check .
      - run: uv run --directory api ruff format --check .
      - run: uv run --directory api pyright
      - run: uv run --directory api pytest
