name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Review 2026-11-27 (L8, M3): weekly, so a test date that expires or a new advisory turns CI red
  # before the next merge does. vercel.yml ignores scheduled runs (no deploy).
  schedule:
    - cron: '0 3 * * 1' # Mondays 08:30 IST

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # web/ — Next.js: lint (eslint + prettier) → typecheck → vitest. No `next build` here: the
  # public pages are ISR and prerender against the api, which CI doesn't run — Vercel's preview
  # build (with API_URL) is the build check.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm's version comes from package.json#packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      # Review 2026-11-27 (M3): restores the dependency gate the lean cleanup dropped (docs/12 V9).
      - run: pnpm audit --prod --audit-level high

  # ---------------------------------------------------------------------------
  # api/ — FastAPI: ruff → pyright → pytest against a throwaway Postgres (S10+)
  # ---------------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container, no password at all (keeps secret scanners quiet too).
          POSTGRES_USER: tripsmith
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tripsmith_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tripsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The pytest DB harness (api/tests/conftest.py) runs every `db`-marked test against it.
      TEST_DATABASE_URL: postgresql+asyncpg://tripsmith@localhost:5432/tripsmith_test
      # A missing TEST_DATABASE_URL fails the run instead of silently skipping the db tests.
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Python's version comes from api/.python-version.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --directory api
      - run: uv run --directory api ruff check .
      - run: uv run --directory api ruff format --check .
      - run: uv run --directory api pyright
      # Review 2026-11-27 (M3): the locked production dependencies, any known advisory fails.
      - name: pip-audit (production lock)
        run: |
          uv export --directory api --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps
      - run: uv run --directory api pytest
      # v4 4.0.5: the MCP server under a real ASGI server and real sockets, driven by the SDK's own
      # client (legacy and 2026-07-28 modes), on its own freshly migrated and seeded database.
      # Catches SDK transport/client changes the in-process tests can't. The same script runs
      # against preview and production at 4.0.6.
      - name: MCP smoke test (uvicorn + SDK client)
        working-directory: api
        env:
          SMOKE_DATABASE_URL: postgresql+asyncpg://tripsmith@localhost:5432/tripsmith_smoke
        run: |
          psql -h localhost -U tripsmith -d tripsmith_test -c 'CREATE DATABASE tripsmith_smoke'
          ALEMBIC_URL="$SMOKE_DATABASE_URL" uv run alembic upgrade head
          uv run python scripts/seed.py --local --database-url "$SMOKE_DATABASE_URL"
          DATABASE_URL="$SMOKE_DATABASE_URL" uv run uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          uv run python scripts/mcp_smoke.py http://127.0.0.1:8000/mcp || { cat uvicorn.log; exit 1; }
