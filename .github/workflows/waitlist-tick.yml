name: Waitlist tick

# R44 (P6) + P15 (R53): walk every departure with a waitlist, then send the automatic emails —
# the same two calls cron-job.org makes on its schedule.
#
# V4 (OP-2): the 15-minute schedule moved to cron-job.org. GitHub ran this one about five times a
# day (gaps of 3–8 h) and disables a schedule after 60 days without a commit. cron-job.org calls
# /cron/waitlist every 15 minutes and /cron/emails every 15 minutes from 09:00 to 21:00 IST, with
# `Authorization: Bearer <CRON_SECRET>`, and emails the owner when a call fails. This workflow is
# the manual button: run it from the Actions tab to push a tick through by hand.
#
# Needs the repo secret CRON_SECRET (the api's own CRON_SECRET). Without it the run fails — a
# manual run that did nothing must not look green.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: waitlist-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Walk the waitlists
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://tripsmith-api.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set — nothing was walked"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/cron/waitlist"

      - name: Send the automatic emails
        if: ${{ !cancelled() }} # a failed waitlist walk must not stop the email retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://tripsmith-api.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set — no emails were sent"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/cron/emails"
