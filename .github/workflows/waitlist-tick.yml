name: Waitlist tick

# R44 (P6): every 15 minutes, walk every departure with a waitlist so a lapsed 10-minute hold or
# a 24 h offer that ran out moves on even when nobody visits the site. Vercel Hobby crons run
# once a day; a GitHub schedule is free on a public repo. GitHub may start a scheduled run late
# (or skip one under load) — `/cron/daily` and every booking, join and claim read walk too.
#
# P15 (R53): between 09:00 and 21:00 IST it also calls /cron/emails, so a run that stopped at its
# limit or a failed send goes on within minutes (the ledger never sends twice). The Vercel cron
# at 09:00 IST is the backstop. A manual run sends the emails at any hour.
#
# V4 (OP-2): GitHub runs this about five times a day, not 96, and disables a schedule after 60
# days without a commit. Accepted for a portfolio project (Viraj, 2026-10-17); cron-job.org is
# the fix if it ever matters. A run without CRON_SECRET fails rather than passing as a no-op.
#
# Needs the repo secret CRON_SECRET (the api's own CRON_SECRET).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: waitlist-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Walk the waitlists
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://tripsmith-api.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set — nothing was walked"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/cron/waitlist"

      - name: Send the automatic emails (09:00–21:00 IST)
        if: ${{ !cancelled() }} # a failed waitlist walk must not stop the email retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://tripsmith-api.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set — no emails were sent"
            exit 1
          fi
          hour=$(TZ=Asia/Kolkata date +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$hour" -lt 9 ] || [ "$hour" -ge 21 ]; }; then
            echo "Outside 09:00–21:00 IST — no emails now"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/cron/emails"
