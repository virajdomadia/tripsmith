# Build on GitHub's runner and upload the finished output to Vercel, so Vercel spends no build minutes.
# Both projects are connected to this repo with Root Directory set (api, web); each folder's vercel.json
# and the project setting skip Vercel's own Git builds, so this workflow is the only production deploy.
# Order: after CI passes on main, the api goes live first — the web build prerenders its ISR pages
# against the live api, and a new web build must never call an api that is not deployed yet.
# The Vercel CLI runs from the repo root: with Root Directory set on the project, it finds the app folder.
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_API, VERCEL_PROJECT_ID_WEB.
name: vercel
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: vercel-production, cancel-in-progress: false }
permissions: { contents: read }
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  NEXT_TELEMETRY_DISABLED: '1'
  # retries any failure, incl. a brief 404 while the domain switches to the new deployment
  SMOKE: curl --fail --silent --show-error --max-time 30 --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null

jobs:
  api:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ env.SHA }}' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: api/.python-version }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test (api + database)
        run: $SMOKE https://tripsmith-api.virajdomadia.com/health/ready

  # v4 deployment gates (04 §v4.8), on every production deploy: the SDK's own client, legacy and
  # 2026-07-28 modes, lists the tools and the prompt and runs a catalogue query on the live api.
  # Proves the lifespan entered the session manager on Vercel and the production Host is allowed.
  # Its own job, so an MCP failure turns the run red without holding back the web deploy.
  mcp:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ env.SHA }}' }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --directory api
      - name: MCP smoke test (production)
        run: uv run --directory api python scripts/mcp_smoke.py https://tripsmith-api.virajdomadia.com/mcp

  # Review 2026-11-27 (C1/M1): the published demo owner login must be read-only on production.
  # Signs in with the login /admin/login prints (the web's public NEXT_PUBLIC_DEMO_* values), reads
  # /auth/session and fails the run unless `readOnly` is true. Needs no secret beyond the token.
  demo-read-only:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      API: https://tripsmith-api.virajdomadia.com
    steps:
      - run: npm install --global vercel@52.2.1
      - run: vercel env pull "$RUNNER_TEMP/web.env" --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Demo owner session is read-only
        run: |
          set -a; . "$RUNNER_TEMP/web.env"; set +a
          test -n "$NEXT_PUBLIC_DEMO_EMAIL" || { echo "NEXT_PUBLIC_DEMO_EMAIL is not set on the web"; exit 1; }
          jar="$RUNNER_TEMP/jar"
          body=$(jq -n --arg e "$NEXT_PUBLIC_DEMO_EMAIL" --arg p "$NEXT_PUBLIC_DEMO_PASSWORD" '{email: $e, password: $p}')
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors -c "$jar"             -H 'Content-Type: application/json' -d "$body" "$API/auth/login" -o /dev/null
          session=$(curl --fail --silent --show-error --max-time 30 -b "$jar" "$API/auth/session")
          curl --silent --max-time 30 -b "$jar" -X POST "$API/auth/logout" -o /dev/null || true
          echo "$session" | jq '{role: .user.role, readOnly}'
          test "$(echo "$session" | jq -r '.readOnly')" = true || { echo "::error::The demo owner can write to production"; exit 1; }

  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ env.SHA }}' }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: $SMOKE https://tripsmith.virajdomadia.com/
