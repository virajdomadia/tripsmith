# Portfolio project, frozen after v2.6: no routine version-update PRs (limit 0). Security
# updates for a known advisory still arrive via the GitHub repo setting, which ignores this limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
